<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A259"/>
      <stop offset="100%" stop-color="#E07A5F"/>
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="100%" stop-color="#FDEBD3"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular suave -->
  <circle cx="32" cy="32" r="31" fill="#3D405B"/>

  <!-- Estrellas decorativas -->
  <g fill="#F2CC8F">
    <circle cx="12" cy="14" r="1.4"/>
    <circle cx="52" cy="12" r="1.1"/>
    <circle cx="50" cy="46" r="1.3"/>
    <circle cx="10" cy="46" r="1"/>
  </g>

  <!-- Libro abierto -->
  <g transform="translate(32 34)">
    <!-- Página izquierda -->
    <path d="M0 -14 C-9 -17 -17 -15 -17 -15 L-17 12 C-17 12 -9 10 0 13 Z"
          fill="url(#pageGradient)" stroke="#3D405B" stroke-width="1.2"/>
    <!-- Página derecha -->
    <path d="M0 -14 C9 -17 17 -15 17 -15 L17 12 C17 12 9 10 0 13 Z"
          fill="url(#pageGradient)" stroke="#3D405B" stroke-width="1.2"/>
    <!-- Lomo del libro -->
    <path d="M0 -14 L0 13" stroke="url(#bookGradient)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Líneas de texto simuladas, página izq -->
    <g stroke="#E07A5F" stroke-width="1" stroke-linecap="round" opacity="0.55">
      <line x1="-13" y1="-9" x2="-3" y2="-10.5"/>
      <line x1="-13" y1="-5" x2="-3" y2="-6.5"/>
      <line x1="-13" y1="-1" x2="-3" y2="-2.5"/>
    </g>
    <!-- Líneas de texto simuladas, página der -->
    <g stroke="#E07A5F" stroke-width="1" stroke-linecap="round" opacity="0.55">
      <line x1="3" y1="-10.5" x2="13" y2="-9"/>
      <line x1="3" y1="-6.5" x2="13" y2="-5"/>
      <line x1="3" y1="-2.5" x2="13" y2="-1"/>
    </g>
  </g>

  <!-- Luna pequeña arriba, tema "hora de cuentos" -->
  <path d="M32 6 a4 4 0 1 0 4 4 a3.1 3.1 0 0 1 -4 -4 Z" fill="#F2CC8F"/>
</svg>
